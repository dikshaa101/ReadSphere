spring.application.name=BookManagementSystem

# Change server port to avoid conflicts (was 8080)
server.port=8080

# Use file: prefix to write to working directory (not classpath)
csv.file.path=file:books.csv
management.endpoints.web.exposure.include=health,info

app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:admin123}
app.security.user.username=${APP_USERNAME:user}
app.security.user.password=${APP_PASSWORD:user123}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# OpenAPI Docs
springdoc.api-docs.path=/v3/api-docs



